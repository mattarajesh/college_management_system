{% extends "students/student_base.html" %}

{% block content %}

<h2>Delete Student</h2>

<h3>Are you sure you want to delete this student?</h3>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Email</th>
</tr>

<tr>
    <td>{{ student.id }}</td>
    <td>{{ student.name }}</td>
    <td>{{ student.age }}</td>
    <td>{{ student.email }}</td>
</tr>

</table>

<br>

<form method="POST">

    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Yes, Delete
    </button>

    <a href="{% url 'student_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
