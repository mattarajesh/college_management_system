{% extends "students/student_base.html" %}

{% block content %}

<h2>Student Details</h2>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <td>{{ student.id }}</td>
</tr>

<tr>
    <th>Name</th>
    <td>{{ student.name }}</td>
</tr>

<tr>
    <th>Age</th>
    <td>{{ student.age }}</td>
</tr>

<tr>
    <th>Email</th>
    <td>{{ student.email }}</td>
</tr>

</table>

<br>

<a href="{% url 'student_list' %}">⬅ Back to Student List</a>

{% endblock %}
