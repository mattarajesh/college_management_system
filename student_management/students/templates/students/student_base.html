<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="text-center text-primary mb-4">
        Student Management System
    </h1>

    <nav class="mb-4">

        <a class="btn btn-primary" href="{% url 'home' %}">
            🏠 Home
        </a>

        <a class="btn btn-secondary" href="{% url 'student_dashboard' %}">
            Dashboard
        </a>

        <a class="btn btn-success" href="{% url 'add_student' %}">
            Add Student
        </a>

        <a class="btn btn-info text-white" href="{% url 'student_list' %}">
            Student List
        </a>

        <a class="btn btn-warning" href="{% url 'search_student' %}">
            Search Student
        </a>

    </nav>

    <!-- Success Messages -->

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-success alert-dismissible fade show" role="alert">

                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

        {% endfor %}

    {% endif %}

    {% block content %}

    {% endblock %}

    <hr>

    <footer class="text-center text-muted">

        <p>© 2026 College Management System</p>

    </footer>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
