{% extends "students/student_base.html" %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

    {% csrf_token %}

    <label>Name</label><br>
    <input type="text" name="name"><br><br>

    <label>Age</label><br>
    <input type="number" name="age"><br><br>

    <label>Email</label><br>
    <input type="email" name="email"><br><br>

    <button type="submit">Save Student</button>

</form>

{% endblock %}
